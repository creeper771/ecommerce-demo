<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexShop | Registro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <a href="index.html" class="logo">NexShop</a>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Catálogo</a></li>
                <li><a href="busqueda.html">Búsqueda</a></li>
                <li><a href="nosotros.html">Quiénes somos</a></li>
                <li><a href="registro.html">Registro</a></li>
                <li><a href="carrito.html">Carrito <span class="cart-counter">0</span></a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2>Crea tu cuenta</h2>
            <form id="registro-form">
                <div class="form-group">
                    <label for="nombre">Nombre completo:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>
                
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Ingrese un correo válido">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password">
                </div>
                
                <div class="form-group">
                    <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                    <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                </div>
                
                <div class="form-group">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terminos" name="terminos">
                    <label for="terminos">Acepto los términos y condiciones de servicio.</label>
                </div>
                
                <button type="submit" id="submit-btn" class="btn" disabled>Registrarse</button>
                <div id="form-message" class="form-message"></div>
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 NexShop. Todos los derechos reservados. <a href="https://github.com" target="_blank">Ver en GitHub</a></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
